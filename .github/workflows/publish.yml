name: Publish

# Publishes the plugin to npm via Trusted Publishing (OIDC) — no NPM_TOKEN
# secret required. Requires a one-time setup on npmjs.com:
#   package settings → Trusted Publisher → GitHub Actions
#   repository: renaudcerrato/opencode-jbcontext
#   workflow:   publish.yml
# Trigger by running the workflow manually from the Actions tab (or via
# `gh workflow run publish.yml`); it publishes whatever version is in
# package.json.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    # Publish only from main: workflow_dispatch can otherwise run from any
    # branch and would publish whatever is checked out.
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write # tag push in the "Tag the release" step
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Check version is not already published
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "::error::$NAME@$VERSION is already published. Bump the version first."
            exit 1
          fi
      - name: Publish
        # JS-DevTools/npm-publish handles first-publish OIDC bootstrapping
        # (raw `npm publish` 404s when the package doesn't exist yet).
        uses: JS-DevTools/npm-publish@0fd2f4369c5d6bcfcde6091a7c527d810b9b5c3f # v4
        with:
          access: public
          provenance: true
      - name: Tag the release
        run: |
          VERSION=$(node -p "require('./package.json').version")
          git tag "v$VERSION" 2>/dev/null || git tag -f "v$VERSION"
          git push origin "v$VERSION"