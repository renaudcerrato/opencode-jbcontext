name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Single jest invocation per job. On Node 22 the text-summary report
      # is captured from the same run and appended to the job summary.
      - name: Run tests
        run: |
          npm test -- --coverage --coverageReporters=text --coverageReporters=text-summary --coverageReporters=json-summary | tee jest-output.txt
      - name: Coverage summary
        if: matrix.node-version == 22
        run: |
          echo "### Coverage" >> $GITHUB_STEP_SUMMARY
          grep -A6 "^Statements" jest-output.txt >> $GITHUB_STEP_SUMMARY || \
            echo "(coverage summary unavailable)" >> $GITHUB_STEP_SUMMARY
      - name: Upload coverage summary
        if: matrix.node-version == 22
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-summary
          path: coverage/coverage-summary.json
          if-no-files-found: warn

  # Regenerates the README coverage badges from the test job's coverage
  # report and commits them back. Runs only on pushes to main; skips
  # quietly when the badges are already up to date.
  badges:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Download coverage summary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: coverage-summary
          path: coverage
      - name: Regenerate badges
        run: npx istanbul-badges-readme
      - name: Commit badge updates
        run: |
          if git diff --quiet README.md; then
            echo "Badges up to date"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: update coverage badges [skip ci]"
            git push
          fi